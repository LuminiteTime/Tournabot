# CI/CD — сборка и деплой на self-hosted сервер
name: Deploy TournaBot

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  prepare_runner:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'docs:')
    steps:
      - name: Setup SSH access
        env:
          RUNNER_SSH_PRIVATE_KEY: ${{ secrets.RUNNER_SSH_PRIVATE_KEY }}
          RUNNER_SSH_HOST: ${{ secrets.RUNNER_SSH_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${RUNNER_SSH_PRIVATE_KEY}" > ~/.ssh/runner_key
          chmod 600 ~/.ssh/runner_key
          ssh-keyscan -H "${RUNNER_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Start self-hosted runner if needed
        env:
          RUNNER_SSH_HOST: ${{ secrets.RUNNER_SSH_HOST }}
          RUNNER_SSH_USER: ${{ secrets.RUNNER_SSH_USER }}
          RUNNER_REMOTE_DIR: ${{ secrets.RUNNER_REMOTE_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/runner_key "${RUNNER_SSH_USER}@${RUNNER_SSH_HOST}" <<EOF
          set -euo pipefail
          RUNNER_DIR="${RUNNER_REMOTE_DIR}"
          PID_FILE="\${RUNNER_DIR}/.ci-managed-runner.pid"
          STATE_FILE="\${RUNNER_DIR}/.ci-managed-runner.state"
          LOG_FILE="\${RUNNER_DIR}/.ci-managed-runner.log"

          if pgrep -af "\${RUNNER_DIR}/bin/Runner.Listener" >/dev/null 2>&1; then
            echo "Runner already running, leaving it untouched."
            rm -f "\${PID_FILE}" "\${STATE_FILE}"
            exit 0
          fi

          cd "\${RUNNER_DIR}"
          nohup ./run.sh > "\${LOG_FILE}" 2>&1 &
          echo \$! > "\${PID_FILE}"
          echo "started_by_ci" > "\${STATE_FILE}"

          sleep 5
          if ! kill -0 "\$(cat "\${PID_FILE}")" 2>/dev/null; then
            echo "Runner failed to start."
            cat "\${LOG_FILE}" || true
            exit 1
          fi

          echo "Runner started by CI."
          EOF

  deploy:
    needs: prepare_runner
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'docs:')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create .env
        run: |
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" > .env
          echo "ADMIN_USER_ID=${{ secrets.ADMIN_USER_ID }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "DATABASE_URL=postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}" >> .env

      - name: Build & restart
        run: |
          docker compose down --remove-orphans
          docker compose build --no-cache
          docker compose up -d

      - name: Cleanup
        run: docker image prune -f

  stop_runner:
    runs-on: ubuntu-latest
    needs: [prepare_runner, deploy]
    if: always() && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'docs:')
    steps:
      - name: Setup SSH access
        env:
          RUNNER_SSH_PRIVATE_KEY: ${{ secrets.RUNNER_SSH_PRIVATE_KEY }}
          RUNNER_SSH_HOST: ${{ secrets.RUNNER_SSH_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${RUNNER_SSH_PRIVATE_KEY}" > ~/.ssh/runner_key
          chmod 600 ~/.ssh/runner_key
          ssh-keyscan -H "${RUNNER_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Stop CI-started self-hosted runner
        env:
          RUNNER_SSH_HOST: ${{ secrets.RUNNER_SSH_HOST }}
          RUNNER_SSH_USER: ${{ secrets.RUNNER_SSH_USER }}
          RUNNER_REMOTE_DIR: ${{ secrets.RUNNER_REMOTE_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/runner_key "${RUNNER_SSH_USER}@${RUNNER_SSH_HOST}" <<EOF
          set -euo pipefail
          RUNNER_DIR="${RUNNER_REMOTE_DIR}"
          PID_FILE="\${RUNNER_DIR}/.ci-managed-runner.pid"
          STATE_FILE="\${RUNNER_DIR}/.ci-managed-runner.state"

          if [[ ! -f "\${STATE_FILE}" ]]; then
            echo "Runner was not started by CI, skipping stop."
            exit 0
          fi

          if [[ -f "\${PID_FILE}" ]]; then
            pid="\$(cat "\${PID_FILE}")"
            if kill -0 "\${pid}" 2>/dev/null; then
              kill "\${pid}" || true
              for _ in {1..30}; do
                if ! kill -0 "\${pid}" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              if kill -0 "\${pid}" 2>/dev/null; then
                kill -9 "\${pid}" || true
              fi
            fi
          fi

          rm -f "\${PID_FILE}" "\${STATE_FILE}"
          echo "Runner stopped."
          EOF
