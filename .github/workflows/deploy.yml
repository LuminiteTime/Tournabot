# CI/CD — сборка и деплой на self-hosted сервер
name: Deploy TournaBot

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  start-runner:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'docs:')
    outputs:
      runner_started: ${{ steps.start.outputs.runner_started }}
      runner_marker: ${{ steps.start.outputs.runner_marker }}
    steps:
      - name: Start self-hosted runner via SSH
        id: start
        shell: bash
        env:
          SSH_HOST: ${{ secrets.RUNNER_SSH_HOST }}
          SSH_PORT: ${{ secrets.RUNNER_SSH_PORT }}
          SSH_USER: ${{ secrets.RUNNER_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.RUNNER_SSH_PRIVATE_KEY }}
          RUNNER_DIR: ${{ secrets.RUNNER_REMOTE_DIR }}
        run: |
          set -euo pipefail

          for k in SSH_HOST SSH_USER SSH_PRIVATE_KEY RUNNER_DIR; do
            if [ -z "${!k:-}" ]; then
              echo "Missing required secret: $k"
              exit 1
            fi
          done

          SSH_PORT="${SSH_PORT:-22}"
          RUNNER_MARKER="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"

          ssh_opts=(
            -i "$key_file"
            -p "$SSH_PORT"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o IdentitiesOnly=yes
            -o ConnectTimeout=20
          )

          set +e
          remote_output="$({
            ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" \
              "RUNNER_DIR='$RUNNER_DIR' RUNNER_MARKER='$RUNNER_MARKER' bash -s" <<'EOF'
          set -euo pipefail

          pid_file="$RUNNER_DIR/.runner-ci-$RUNNER_MARKER.pid"
          log_file="$RUNNER_DIR/.runner-ci-$RUNNER_MARKER.log"

          if [ ! -d "$RUNNER_DIR" ]; then
            echo "Runner directory does not exist: $RUNNER_DIR"
            exit 1
          fi

          if [ ! -f "$RUNNER_DIR/run.sh" ]; then
            echo "run.sh not found in: $RUNNER_DIR"
            exit 1
          fi

          if pgrep -f "$RUNNER_DIR/.*(Runner.Listener|run.sh)" >/dev/null 2>&1; then
            echo "runner_started=false"
            echo "runner_marker=$RUNNER_MARKER"
            exit 0
          fi

          cd "$RUNNER_DIR"
          chmod +x ./run.sh || true
          if [ "$(id -u)" -eq 0 ]; then
            nohup env RUNNER_ALLOW_RUNASROOT=1 ./run.sh > "$log_file" 2>&1 &
          else
            nohup ./run.sh > "$log_file" 2>&1 &
          fi
          pid=$!
          sleep 2

          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Runner failed to start"
            tail -n 100 "$log_file" || true
            exit 1
          fi

          echo "$pid" > "$pid_file"
          echo "runner_started=true"
          echo "runner_marker=$RUNNER_MARKER"
          EOF
          } 2>&1)"
          ssh_exit=$?
          set -e

          echo "$remote_output"

          if [ "$ssh_exit" -ne 0 ]; then
            echo "SSH bootstrap failed with exit code: $ssh_exit"
            exit "$ssh_exit"
          fi

          started="$(printf '%s\n' "$remote_output" | awk -F= '/^runner_started=/{print $2}' | tail -n 1)"
          marker="$(printf '%s\n' "$remote_output" | awk -F= '/^runner_marker=/{print $2}' | tail -n 1)"

          if [ -z "$started" ] || [ -z "$marker" ]; then
            echo "Unable to parse runner start status from remote output"
            exit 1
          fi

          echo "runner_started=$started" >> "$GITHUB_OUTPUT"
          echo "runner_marker=$marker" >> "$GITHUB_OUTPUT"

  deploy:
    needs: start-runner
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'docs:')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Create .env
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          set -euo pipefail

          missing=0
          for k in BOT_TOKEN ADMIN_USER_ID POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB; do
            v="${!k:-}"
            if [ -z "$v" ]; then
              echo "Missing secret: $k"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Some required secrets are missing. Configure them in the repository settings."
            exit 1
          fi

          {
            echo "BOT_TOKEN=$BOT_TOKEN"
            echo "ADMIN_USER_ID=$ADMIN_USER_ID"
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_DB=$POSTGRES_DB"
            echo "DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
          } > .env

      - name: Show Docker versions
        shell: bash
        run: |
          set -e
          docker --version
          if command -v docker-compose &>/dev/null; then
            docker-compose --version
          else
            docker compose version
          fi

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -e
          if command -v docker-compose &>/dev/null; then
            docker-compose down --remove-orphans || true
            docker-compose build --no-cache
            docker-compose up -d
            comp="docker-compose"
          else
            docker compose down --remove-orphans || true
            docker compose build --no-cache
            docker compose up -d
            comp="docker compose"
          fi

          echo "Waiting for container to initialize..."
          sleep 15

          $comp ps
          if $comp ps | grep -q "Up" && ! $comp ps | grep -q "Restarting"; then
            echo "Container is running"
            $comp logs --tail=100 || true
          else
            echo "Container failed to start"
            $comp logs || true
            $comp ps -a
            exit 1
          fi

      - name: Cleanup
        shell: bash
        run: docker image prune -f

  stop-runner:
    runs-on: ubuntu-latest
    needs:
      - start-runner
      - deploy
    if: always() && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'docs:')
    steps:
      - name: Stop self-hosted runner via SSH
        if: needs.start-runner.outputs.runner_started == 'true'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.RUNNER_SSH_HOST }}
          SSH_PORT: ${{ secrets.RUNNER_SSH_PORT }}
          SSH_USER: ${{ secrets.RUNNER_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.RUNNER_SSH_PRIVATE_KEY }}
          RUNNER_DIR: ${{ secrets.RUNNER_REMOTE_DIR }}
          RUNNER_MARKER: ${{ needs.start-runner.outputs.runner_marker }}
        run: |
          set -euo pipefail

          for k in SSH_HOST SSH_USER SSH_PRIVATE_KEY RUNNER_DIR RUNNER_MARKER; do
            if [ -z "${!k:-}" ]; then
              echo "Missing required value: $k"
              exit 1
            fi
          done

          SSH_PORT="${SSH_PORT:-22}"

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"

          ssh_opts=(
            -i "$key_file"
            -p "$SSH_PORT"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o IdentitiesOnly=yes
            -o ConnectTimeout=20
          )

          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" \
            "RUNNER_DIR='$RUNNER_DIR' RUNNER_MARKER='$RUNNER_MARKER' bash -s" <<'EOF'
          set -euo pipefail

          pid_file="$RUNNER_DIR/.runner-ci-$RUNNER_MARKER.pid"

          if [ ! -f "$pid_file" ]; then
            echo "Runner PID file not found, nothing to stop"
            exit 0
          fi

          pid="$(cat "$pid_file")"
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
            kill "$pid" || true
            sleep 2
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" || true
            fi
            echo "Stopped runner process: $pid"
          else
            echo "Runner process already stopped"
          fi

          rm -f "$pid_file"
          EOF

      - name: Skip stop
        if: needs.start-runner.outputs.runner_started != 'true'
        shell: bash
        run: echo "Runner was already running before deploy, nothing to stop"
