name: Deploy TournaBot

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:

  deploy:
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'docs:')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Create .env
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          set -euo pipefail

          missing=0
          for k in BOT_TOKEN ADMIN_USER_ID POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB; do
            v="${!k:-}"
            if [ -z "$v" ]; then
              echo "Missing secret: $k"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Some required secrets are missing. Configure them in the repository settings."
            exit 1
          fi

          {
            echo "BOT_TOKEN=$BOT_TOKEN"
            echo "ADMIN_USER_ID=$ADMIN_USER_ID"
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_DB=$POSTGRES_DB"
            echo "DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
          } > .env

      - name: Show Docker versions
        shell: bash
        run: |
          set -e
          docker --version
          if command -v docker-compose &>/dev/null; then
            docker-compose --version
          else
            docker compose version
          fi

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -e
          if command -v docker-compose &>/dev/null; then
            docker-compose down --remove-orphans || true
            docker-compose build
            docker-compose up -d --remove-orphans
            comp="docker-compose"
          else
            docker compose down --remove-orphans || true
            docker compose build
            docker compose up -d --remove-orphans
            comp="docker compose"
          fi

          echo "Waiting for container to initialize..."
          sleep 15

          $comp ps
          if $comp ps | grep -q "Up" && ! $comp ps | grep -q "Restarting"; then
            echo "Container is running"
            $comp logs --tail=100 || true
          else
            echo "Container failed to start"
            $comp logs || true
            $comp ps -a
            exit 1
          fi

      - name: Cleanup Docker and runner temp cache
        if: always()
        shell: bash
        run: |
          set +e
          docker image prune -af || true
          docker builder prune -af || true
          if [ -n "${RUNNER_WORKSPACE:-}" ] && [ -d "${RUNNER_WORKSPACE}/_update" ]; then
            rm -rf "${RUNNER_WORKSPACE}/_update"
          fi
